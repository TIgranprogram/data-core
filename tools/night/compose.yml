# T23: новый уникальный project/DB/volumes; legacy dcnight не используется.
# Запуск только через tools/night.mjs с проверкой паспорта и пустого inventory.
name: ${NIGHT_PROJECT:?}
x-owner: &owner
  dc.night.owner: datacore-night-v1
  dc.night.run: ${NIGHT_RUN_ID:?}
  dc.night.db: ${NIGHT_DB:?}
services:
  keyfile:
    image: busybox:1.36
    container_name: ${NIGHT_PROJECT:?}-keyfile
    labels: *owner
    restart: "no"
    environment:
      KF: ${NIGHT_KEYFILE:?}
    volumes:
      - secrets:/secrets
    entrypoint: >-
      sh -c "mkdir -p /secrets && printf '%s' \"$$KF\" > /secrets/mongo-keyfile
      && chown 999:999 /secrets/mongo-keyfile && chmod 600 /secrets/mongo-keyfile"
  mongo:
    image: mongo:4.4
    container_name: ${NIGHT_PROJECT:?}-mongo
    labels: *owner
    restart: "no"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/run/secrets/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${NIGHT_ROOT_PW:?}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - secrets:/run/secrets:ro
    depends_on:
      keyfile:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ${NIGHT_SRC:?}/backend
    image: ${NIGHT_PROJECT:?}-backend:latest
    container_name: ${NIGHT_PROJECT:?}-backend
    labels: *owner
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: "3000"
      DISABLE_THROTTLE: "1"
      SHEETS_SYNC_INTERVAL_MIN: "0"
      DISABLE_PASSWORD_DRIFT_CHECK: "1"
      MONGO_DB: ${NIGHT_DB:?}
      MONGO_URI: mongodb://dcnight:${NIGHT_APP_PW:?}@mongo:27017/${NIGHT_DB}?authSource=admin&replicaSet=rs0
      JWT_SECRET: ${NIGHT_JWT:?}
      JWT_REFRESH_SECRET: ${NIGHT_JWT_REFRESH:?}
      ADMIN_USERNAME: ${NIGHT_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${NIGHT_ADMIN_PW:?}
    volumes:
      - ${NIGHT_SRC}/backend/admin:/app/admin:ro
      - ${NIGHT_SRC}/backend/pwa:/app/pwa:ro
      - uploads:/app/uploads
  proxy:
    image: alpine/socat@sha256:466c8a0383e16463fabdb7df01008292fb78d07da60224a46cb5d3142ce122ed
    container_name: ${NIGHT_PROJECT:?}-proxy
    labels: *owner
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["socat TCP-LISTEN:3000,fork,reuseaddr TCP:backend:3000 & socat TCP-LISTEN:27017,fork,reuseaddr TCP:mongo:27017 & wait"]
    networks: [default, access]
    ports:
      - "127.0.0.1:${NIGHT_API_PORT:?}:3000"
      - "127.0.0.1:${NIGHT_MONGO_PORT:?}:27017"
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_started
volumes:
  secrets:
    labels: *owner
  mongo-data:
    labels: *owner
  mongo-config:
    labels: *owner
  uploads:
    labels: *owner
networks:
  default:
    internal: true
    labels: *owner
  access:
    internal: false
    labels: *owner
