<!doctype html>
<html lang="ru" data-theme="soft">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лаборатория Рабочего места</title>
<link rel="stylesheet" href="../../../backend/pwa/ui/tokens.css">
<style>
:root[data-theme=dark]{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui}header,nav,main,aside{padding:var(--s5)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-strong)}h1,h2,h3{color:var(--heading);margin:0 0 var(--s3)}p{margin:var(--s2) 0}header h1{margin:0}nav{display:grid;align-content:start;gap:var(--s2);border-right:1px solid var(--border-strong)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(360px,38%);min-height:calc(100vh - 82px)}aside{background:var(--surface,var(--bg));border-left:1px solid var(--border-strong)}button,input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);padding:var(--s2) var(--s3)}button,summary{cursor:pointer}nav button{text-align:left}button[aria-current=true],.primary{background:var(--heading);color:var(--bg)}label{display:grid;gap:var(--s1);margin:var(--s3) 0}textarea{resize:vertical}section,details,.tile{border:1px solid var(--border-strong);border-radius:var(--radius);padding:var(--s4);margin:var(--s3) 0}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:var(--s2);border-bottom:1px solid var(--border)}small{color:var(--muted,var(--text))}.row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}.badge{border:1px solid var(--border-strong);border-radius:var(--radius-pill);padding:var(--s1) var(--s2)}dl{display:grid;grid-template-columns:max-content 1fr;gap:var(--s2) var(--s4)}dd{margin:0}a{color:var(--heading)}@media(max-width:950px){.layout{grid-template-columns:180px 1fr}aside{grid-column:2}}@media(max-width:600px){.layout{display:block}nav{display:flex;overflow:auto}nav button{white-space:nowrap}}
.invoice-head{display:flex;align-items:start;justify-content:space-between;gap:var(--s4)}
.invoice-head h2{margin-bottom:var(--s1)}
.invoice-total{text-align:right;white-space:nowrap}
.invoice-total strong{display:block;font-size:1.25rem;color:var(--heading)}
.quick-edit{margin:var(--s4) 0;padding:var(--s4);border:1px solid var(--border-strong);border-inline-start:3px solid var(--heading);border-radius:var(--radius)}
.quick-edit input{max-width:14rem}.quick-edit textarea{background:var(--surface,var(--bg))}
.quick-actions{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.primary:disabled{opacity:.55;cursor:default}
.invoice-details details{margin:0;padding:0;border:0;border-bottom:1px solid var(--border-strong);border-radius:0}
.invoice-details summary{padding:var(--s3) 0}.invoice-details summary small{margin-inline-start:var(--s2)}
.invoice-details details>div{padding:0 var(--s3) var(--s3)}.qty{text-align:right;white-space:nowrap}
.invoice-details h3{margin-top:var(--s5)}[hidden]{display:none!important}
</style>
<header><div><h1>Лаборатория Рабочего места</h1><small>Учебные данные · изменения сохраняются в этом браузере</small></div><button id="theme">Сменить тему</button></header>
<div class="layout"><nav id="nav" aria-label="Виды информации"></nav><main id="demo"></main><aside id="card" aria-label="Пример правой панели"></aside></div>
<script>
const screens = [
 ['Карточка счёта','Идентификатор, состояние, дата, примечание и сумма','Снабжение · заказы · карточки', '<table><thead><tr><th>Счёт</th><th>Состояние</th><th>Сумма</th></tr></thead><tbody><tr><td><button id="openInvoice">№ 1055</button></td><td id="invoiceStatus">Оплачен</td><td>21 750 ₽</td></tr></tbody></table><label>Статус для примера<select id="scenario"><option>Черновик</option><option>Выставлен</option><option selected>Оплачен</option><option>Отменён</option></select></label><label class="row"><input id="partial" type="checkbox"> Видна часть позиций</label>'],
 ['Справочники','Название, код, категория, единица, связь с другой записью','Контрагенты · сотрудники · каталоги', '<table><tr><th>Название</th><th>Единица</th><th>Категория</th></tr><tr><td>Труба 20×20</td><td>м</td><td>Обычная сталь</td></tr></table>'],
 ['Строки и состав','Количества, размеры, единицы, вложенные строки','Склад · изделия · модули · КП · позиции заказа','<table><tr><th>Деталь</th><th>Размер</th><th>Количество</th></tr><tr><td>Стойка</td><td>20 × 20 × 6000 мм</td><td>4 шт.</td></tr></table><details><summary>Состав стойки</summary><p>Труба 6 м · заглушка 2 шт.</p></details>'],
 ['Этапы и сроки','Состояние, приоритет, исполнитель, плановая и фактическая даты','Заявки · проектирование · производство · Сегодня','<div class="row"><section><h3>На распределении</h3><p>Навигационная стела</p><small>Срок 02.12.2026</small></section><section><h3>В работе</h3><p>Деревянный гамак</p><small>Исполнитель: мастер участка</small></section></div>'],
 ['Деньги','Сумма, остаток, валюта, налог, платежи и итоги','Доходы · расходы · платёжный календарь · ФОТ','<dl><dt>Сумма счёта</dt><dd>21 750 ₽</dd><dt>Оплачено</dt><dd>21 750 ₽</dd><dt>Остаток</dt><dd>0 ₽</dd></dl><details><summary>Платёж · 26.11.2026</summary><p>21 750 ₽ · банковский перевод</p></details>'],
 ['Файлы и документы','Фотографии, чертежи, вложения, документы и версии','Паспорта · документация · договоры · изделия','<section><h3>Паспорт изделия</h3><p>Версия 2 · утверждён 26.11.2026</p><details><summary>Сведения о файле</summary><p>Паспорт.pdf · 340 КБ</p></details></section>'],
 ['История и обсуждение','События с автором, открытые вопросы, изменение значений','История карточек · комментарии · уведомления','<ol><li>27.11 · Менеджер изменил срок на 02.12</li><li>26.11 · Бухгалтер указал оплату</li></ol><details><summary>Что изменилось</summary><p>Плановая доставка: 30.11 → 02.12</p></details>'],
 ['Сводки и настройки','Показатели, внимание, переключатели, права и состояние','Рабочий стол · настройки · системные сообщения','<div class="row"><section><h3>3</h3>поставки сегодня</section><section><h3>1</h3>требует внимания</section></div><p>Роль: менеджер · склад: основной</p>']
];
const nav=document.querySelector('#nav'),demo=document.querySelector('#demo'),card=document.querySelector('#card');
const key='datacore-ui-lab-invoice';
const data=JSON.parse(localStorage.getItem(key)||'{}');
const draft = { delivery: data.delivery || '', note: data.note || '' };
function invoice(status = 'Оплачен', partial = false) {
 const paid = status === 'Оплачен';
 const reason = partial ? 'Видна часть позиций. Счёт доступен для просмотра.' :
   status === 'Отменён' ? 'Счёт отменён. Поля доступны для просмотра.' : '';
 card.innerHTML = `
   <div class="invoice-head">
     <div><h2>Счёт № 1055</h2><p>Учебный поставщик · 25.11.2026</p><span class="badge" id="cardStatus"></span></div>
     <div class="invoice-total"><small>Сумма счёта</small><strong>21 750 ₽</strong></div>
   </div>
   <form class="quick-edit" aria-labelledby="delivery-title">
     <h3 id="delivery-title">Доставка</h3>
     <p id="limit-reason" hidden></p>
     <label>Дата доставки<input type="date" name="delivery"></label>
     <label>Примечание<textarea name="note" rows="2" maxlength="1000" placeholder="Например: привезти до обеда"></textarea></label>
     <div class="quick-actions"><button class="primary">Сохранить</button><small role="status"></small></div>
   </form>
   <div class="invoice-details">
     <h3>По счёту</h3>
     <details open><summary><strong>Позиции</strong><small>${partial ? '1 видимая' : '2 позиции'}</small></summary><div>
       <table><thead><tr><th scope="col">Наименование</th><th scope="col" class="qty">Количество</th></tr></thead>
       <tbody><tr><td>Труба 20×20</td><td class="qty">30 м</td></tr>
       <tr ${partial ? 'hidden' : ''}><td>Заглушка</td><td class="qty">20 шт.</td></tr></tbody></table>
     </div></details>
     <details><summary><strong>Оплата</strong><small>${paid ? '21 750 ₽ оплачено' : 'Без платежей'}</small></summary>
       <div><p>${paid ? '26.11.2026 · Банковский перевод · 21 750 ₽' : 'Платежей по этому учебному счёту пока нет.'}</p></div></details>
     <details><summary><strong>Реквизиты</strong><small>Договор № 24</small></summary>
       <div><dl><dt>Поставщик</dt><dd>Учебный поставщик</dd><dt>Дата счёта</dt><dd>25.11.2026</dd><dt>Договор</dt><dd>№ 24</dd></dl></div></details>
     <details><summary><strong>Файлы</strong><small>Счёт.pdf</small></summary><div>PDF · 240 КБ</div></details>
     <details><summary><strong>История</strong><small>${paid ? '3 события' : '2 события'}</small></summary>
       <div><ol><li>25.11 · счёт создан</li><li>25.11 · счёт выставлен</li>${paid ? '<li>26.11 · оплата зарегистрирована</li>' : ''}</ol></div></details>
   </div>`;
 card.querySelector('#cardStatus').textContent = status;
 const form = card.querySelector('form');
 const hint = form.querySelector('[role=status]');
 const save = form.querySelector('button');
 const dirty = () => draft.delivery !== (data.delivery || '') || draft.note !== (data.note || '');
 const refresh = () => {
   save.disabled = Boolean(reason) || !dirty();
   hint.textContent = !reason && dirty() ? 'Есть изменения' : '';
 };
 if (reason) {
   const notice = form.querySelector('#limit-reason');
   notice.hidden = false;
   notice.textContent = reason;
   form.elements.delivery.readOnly = form.elements.note.readOnly = true;
 }
 form.elements.delivery.value = reason ? data.delivery || '' : draft.delivery;
 form.elements.note.value = reason ? data.note || '' : draft.note;
 form.oninput = () => {
   if (reason) return;
   Object.assign(draft, Object.fromEntries(new FormData(form)));
   refresh();
 };
 form.onsubmit = event => {
   event.preventDefault();
   if (reason || !dirty()) return;
   Object.assign(data, draft);
   localStorage.setItem(key, JSON.stringify(data));
   refresh();
   hint.textContent = 'Сохранено';
 };
 refresh();
}
function show(i){
 const [name,types,areas,example]=screens[i];
 for(const [j,button] of [...nav.children].entries())button.setAttribute('aria-current',String(i===j));
 demo.innerHTML='<h2>'+name+'</h2><p>'+types+'</p><small>'+areas+'</small><section aria-label="Пример отображения">'+example+'</section>';
 if(i===0){const status=demo.querySelector('#scenario'),partial=demo.querySelector('#partial');const update=()=>{demo.querySelector('#invoiceStatus').textContent=status.value;invoice(status.value,partial.checked);};status.onchange=partial.onchange=update;demo.querySelector('#openInvoice').onclick=()=>card.querySelector('input').focus();update();}
 else card.innerHTML='<h2>В карточке</h2><p>'+types+'</p><small>'+areas+'</small>';
}
screens.forEach(([name],i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>show(i);nav.append(b);});
document.querySelector('#theme').onclick=()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'soft':'dark';};
show(0);
</script>
</html>
