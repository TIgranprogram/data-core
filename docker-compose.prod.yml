# Personal Data Core — Production stack (Ubuntu VM на Synology)
#
# Отдельный контур РЯДОМ с работающим kppdf-8.0:
#   kppdf:     :3000 (mongo 4.4, kppdf-mongo)  — НЕ трогать
#   data-core: :3001 (mongo 4.4, datacore-mongo) — этот файл
#     (4.4 — потому что VM = Celeron J4125 без AVX; MongoDB 5.0+ не стартует)
#
# Up:     sudo docker compose -f docker-compose.prod.yml up -d --build
# Logs:   sudo docker compose -f docker-compose.prod.yml logs -f backend
# Health: curl -sf http://localhost:3001/api/health/ready
#
# Секреты (JWT_*, ADMIN_PASSWORD, MONGO_*) приходят из .env на хосте — дефолтов нет.
# Порты контура: API 3001, mongo 27018 (только 127.0.0.1 VM).

services:
  mongo:
    # 4.4 — жёсткое ограничение железа VM (Celeron J4125 без AVX): MongoDB 5.0+
    # на нём падает с "Illegal instruction". kppdf тоже работает на 4.4 здесь.
    # Совместимость бэкенда доказана: backend/scripts/test-mongoose-compat.js
    # (mongoose 8.24 → 4.4.30: CRUD/транзакции/listCollections/createIndex).
    # Ключ: 4.4 отдаёт только легаси-шелл `mongo`, поэтому все скрипты ниже
    # через BIN=$$(command -v mongosh || command -v mongo) работают на обеих ветках.
    image: ${MONGO_IMAGE:-mongo:4.4}
    container_name: datacore-mongo
    restart: unless-stopped
    # --auth + --keyFile — как в локальном docker-compose.yml (задача B/P0.4):
    # MongoDB не запускает --auth с replica set без security.keyFile.
    # На ПУСТОМ datadir entrypoint сам создаёт root из MONGO_INITDB_ROOT_*.
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--auth",
        "--keyFile",
        "/run/secrets/mongo-keyfile",
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    ports:
      # только localhost VM; наружу доступ через API или SSH-туннель
      - "127.0.0.1:27018:27017"
    volumes:
      - ${DATA_DIR}/mongodb:/data/db
      - mongo-secrets:/run/secrets:ro
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    healthcheck:
      # ping требует аутентификации → логинимся как root
      test:
        [
          "CMD-SHELL",
          "BIN=$$(command -v mongosh || command -v mongo); $$BIN --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  # Разовая генерация keyfile (600, uid 999) в именованный том mongo-secrets.
  mongo-keyfile:
    image: ${MONGO_IMAGE:-mongo:4.4}
    restart: "no"
    environment:
      MONGO_KEYFILE_SECRET: ${MONGO_KEYFILE_SECRET:?MONGO_KEYFILE_SECRET is required}
    volumes:
      - mongo-secrets:/secrets
    entrypoint: >-
      sh -c "mkdir -p /secrets
      && printf '%s' \"$$MONGO_KEYFILE_SECRET\" > /secrets/mongo-keyfile
      && chown 999:999 /secrets/mongo-keyfile
      && chmod 600 /secrets/mongo-keyfile
      && echo 'keyfile ready'"

  # Одноразовая инициализация Replica Set rs0 (обязателен для транзакций).
  mongo-init:
    image: ${MONGO_IMAGE:-mongo:4.4}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    # С --auth логинимся как root, иначе и rs.status(), и rs.initiate() отклоняются.
    entrypoint: >-
      sh -c "BIN=$$(command -v mongosh || command -v mongo);
      $$BIN --host mongo:27017
      -u \"$$MONGO_ROOT_USER\" -p \"$$MONGO_ROOT_PASSWORD\"
      --authenticationDatabase admin --eval
      'var s=null; try { s=rs.status(); } catch(e) { s={ok:0}; }
      if (!s || s.ok!==1) {
        printjson(rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"mongo:27017\"}]}));
      } else { print(\"rs already ok\"); }'"

  # Приложение-пользователь Mongo (idempotent). MONGO_INITDB_ROOT_* создаёт только
  # root — на ПУСТОМ datadir (первый деплой) без этого сервиса бэкенд упал бы по auth.
  # Значения приходят аргументами (легаси-шелл 4.4 не знает process.env);
  # пароли НЕ должны содержать одинарные кавычки.
  mongo-appuser:
    image: ${MONGO_IMAGE:-mongo:4.4}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: "no"
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_APP_USER: ${MONGO_APP_USER:-datacore}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      MONGO_DB: ${MONGO_DB:-datacore}
    volumes:
      - ./backend/scripts/mongo-create-appuser.js:/scripts/mongo-create-appuser.js:ro
    entrypoint: >-
      sh -c "BIN=$$(command -v mongosh || command -v mongo);
      $$BIN --host mongo:27017
      -u \"$$MONGO_ROOT_USER\" -p \"$$MONGO_ROOT_PASSWORD\"
      --authenticationDatabase admin --eval
      \"load('/scripts/mongo-create-appuser.js');
      createAppUser('$$MONGO_APP_USER','$$MONGO_APP_PASSWORD','$$MONGO_DB');\""

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datacore-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mongo-appuser:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # с креденшелами: app-user datacore, authSource=datacore (задача B)
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required (with user:password@host)}
      MONGO_DB: ${MONGO_DB:-datacore}
      MONGO_REPLICA_SET: rs0
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-15m}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-30d}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3001}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      # 1 — только стенд без HTTPS (SRV-ERP): без upgrade-insecure-requests и HSTS; на проде пусто
      HTTP_STAND: "${HTTP_STAND:-}"
    volumes:
      - ${DATA_DIR}/uploads:/app/uploads
      - ./secrets:/app/secrets:ro   # ключ сервисного аккаунта Google (google-sa.json) — чтение Google-таблиц
      - ${DATA_DIR}:/host-data:ro   # только чтение: место на диске, размер фото и бэкапов (/api/health/disk, ДИ.1)
      - ${DATA_DIR}/bundles:/host-bundles   # готовые переносные пакеты (bundle-watch.sh): список, скачивание и удаление в админке
      - ${DATA_DIR}/bundle-requests:/host-requests   # запись: только файл-запрос и status.json моста bundle-watch.sh (cron на хосте)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s

# Именованные тома. mongo-secrets — keyfile для --auth + rs0.
volumes:
  mongo-secrets:
