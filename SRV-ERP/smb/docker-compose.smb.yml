# Добавка к docker-compose.prod.yml: backend пишет файлы доступа к SMB в общий каталог хоста и видит переключатель.
# Запуск: docker compose -f docker-compose.prod.yml -f SRV-ERP/smb/docker-compose.smb.yml up -d --no-deps backend
# docker-compose.prod.yml передаёт в backend только явный список переменных — OFFSITE_* добавляем здесь (значения — из .env).
services:
  backend:
    environment:
      OFFSITE_SMB: ${OFFSITE_SMB:-}
      OFFSITE_SMB_AUTH_DIR: ${OFFSITE_SMB_AUTH_DIR:-/var/lib/datacore/smb}
    volumes:
      - /var/lib/datacore/smb:/var/lib/datacore/smb
