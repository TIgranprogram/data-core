name: ${NS_PROJECT}
x-labels: &owner
  io.datacore.nightshift.owner: ${NS_OWNER}
services:
  mongo:
    image: mongo:4.4
    container_name: ${NS_PROJECT}-mongo
    labels: *owner
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [mongo-data:/data/db]
    networks: [isolated]
    healthcheck:
      test: [CMD, mongo, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
      interval: 3s
      timeout: 3s
      retries: 30
  mongo-init:
    image: mongo:4.4
    container_name: ${NS_PROJECT}-mongo-init
    labels: *owner
    depends_on:
      mongo: {condition: service_healthy}
    entrypoint: [mongo, --host, 'mongo:27017', --quiet, --eval, 'var r=rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); if(r.ok!==1) quit(1); for(var i=0;i<60;i++){if(db.isMaster().ismaster) quit(0);sleep(1000);}quit(1);']
    networks: [isolated]
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${NS_PROJECT}-mailpit
    labels: *owner
    networks: [isolated]
  app:
    image: ${NS_PROJECT}-app:latest
    build:
      context: ../../../backend
      dockerfile: ../tests_ai_tiit/nightshift/stand/Dockerfile
    container_name: ${NS_PROJECT}-app
    labels: *owner
    environment:
      NODE_ENV: test
      PORT: '3000'
      MONGO_URI: mongodb://mongo:27017/${NS_DB}?replicaSet=rs0
      MONGO_DB: ${NS_DB}
      MONGO_DB_TEST: ${NS_TEST_DB}
      JWT_SECRET: synthetic-nightshift-jwt-minimum-32
      JWT_REFRESH_SECRET: synthetic-nightshift-refresh-minimum-32
      ADMIN_PASSWORD: synthetic-nightshift-admin
      ADMIN_USERNAME: "${NS_ADMIN_USERNAME}"
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      CORS_ORIGIN: http://app:3000
    volumes:
      - ./regression.cjs:/nightshift/regression.cjs:ro
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    networks: [isolated]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 4s
      retries: 30
networks:
  isolated:
    name: ${NS_PROJECT}-internal
    internal: true
    labels: *owner
volumes:
  mongo-data:
    name: ${NS_PROJECT}-mongo-data
    labels: *owner
