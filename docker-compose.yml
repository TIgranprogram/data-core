# Personal Data Core — самостоятельный сервер данных (MongoDB + NestJS API)
#
# Up:     docker compose up -d --build
# Env:    cp .env.example .env   (compose подставляет ${...} из .env)
# Health: http://localhost:3000/api/health/ready
# Swagger: http://localhost:3000/docs  (dev; в prod — SWAGGER_ENABLED=true)
#
# MongoDB опубликован ТОЛЬКО на 127.0.0.1 — наружу доступ идёт через API (:3000)
# или через SSH-туннель. Никогда не публикуй 27017 наружу.

services:
  mongo:
    # 4.4 — потому что VM (Celeron J4125) физически не имеет AVX, а MongoDB
    # 5.0+ требует AVX (падает "Illegal instruction"). Проверено: mongoose 8.24
    # полностью совместим с 4.4.30 (backend/scripts/test-mongoose-compat.js).
    # На AVX-железе можно поднять MONGO_IMAGE=mongo:7 в .env (после проверки
    # restore-дриллом — дампы 4.4->7 переносятся mongodump/mongorestore).
    image: ${MONGO_IMAGE:-mongo:4.4}
    container_name: datacore-mongo
    restart: unless-stopped
    # --auth: доступ только по паролю (задача B, P0.4). На ПУСТОМ datadir
    # entrypoint сам создаёт root из MONGO_INITDB_ROOT_*; на уже существующем
    # (локальный контур) пользователей создаёт backend/scripts/mongo-bootstrap-auth.js.
    # --keyFile обязателен: MongoDB не запускает --auth вместе с replica set
    # без security.keyFile (одноузловой rs0 использует его как общий секрет кластера).
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--auth",
        "--keyFile",
        "/run/secrets/mongo-keyfile",
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    ports:
      # Host-порт Mongo тоже параметризован: на машине может крутиться другой
      # контур (odr/kppdf) с занятым 27017 → подставь свой из .env (MONGO_PORT).
      # Привязка ТОЛЬКО к 127.0.0.1 — наружу 27017 не торчит никогда.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - ${DATA_DIR}/mongodb:/data/db
      - mongo-secrets:/run/secrets:ro
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    healthcheck:
      # ping требует аутентификации → логинимся как root.
      # BIN: mongo:4.4 даёт только легаси-шелл `mongo`, 5.0+ — только `mongosh`.
      # Оба понимают -u/-p/--authenticationDatabase/--eval.
      test:
        [
          "CMD-SHELL",
          "BIN=$$(command -v mongosh || command -v mongo); $$BIN --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  # Разовая генерация keyfile в именованный том mongo-secrets.
  # Файл должен принадлежать uid 999 (mongodb) и быть доступен только ему (600),
  # иначе mongod упадёт с "permissions are too open".
  mongo-keyfile:
    image: ${MONGO_IMAGE:-mongo:4.4}
    restart: "no"
    environment:
      MONGO_KEYFILE_SECRET: ${MONGO_KEYFILE_SECRET:?MONGO_KEYFILE_SECRET is required}
    volumes:
      - mongo-secrets:/secrets
    entrypoint: >-
      sh -c "mkdir -p /secrets
      && printf '%s' \"$$MONGO_KEYFILE_SECRET\" > /secrets/mongo-keyfile
      && chown 999:999 /secrets/mongo-keyfile
      && chmod 600 /secrets/mongo-keyfile
      && echo 'keyfile ready'"

  # Одноразовая инициализация Replica Set rs0 (обязателен для транзакций).
  mongo-init:
    image: ${MONGO_IMAGE:-mongo:4.4}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    # rs.status() возвращает {ok:0} и НЕ бросает ошибку, когда RS не инициализирован.
    # С --auth логинимся как root, иначе и rs.status(), и rs.initiate() отклоняются.
    # BIN: поддерживаем и mongo:4.4 (легаси `mongo`), и 5.0+ (`mongosh`).
    entrypoint: >-
      sh -c "BIN=$$(command -v mongosh || command -v mongo);
      $$BIN --host mongo:27017
      -u \"$$MONGO_ROOT_USER\" -p \"$$MONGO_ROOT_PASSWORD\"
      --authenticationDatabase admin --eval
      'var s=null; try { s=rs.status(); } catch(e) { s={ok:0}; }
      if (!s || s.ok!==1) {
        printjson(rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"mongo:27017\"}]}));
      } else { print(\"rs already ok\"); }'"

  # Приложение-пользователь Mongo (idempotent). MONGO_INITDB_ROOT_* создаёт только
  # root — без этого сервиса на пустом datadir бэкенд не смог бы авторизоваться.
  # Значения передаются в JS аргументами (легаси-шелл mongo:4.4 не знает process.env),
  # пароли НЕ должны содержать одинарные кавычки (они внутри JS-строк).
  mongo-appuser:
    image: ${MONGO_IMAGE:-mongo:4.4}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: "no"
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_APP_USER: ${MONGO_APP_USER:-datacore}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      MONGO_DB: ${MONGO_DB:-datacore}
    volumes:
      - ./backend/scripts/mongo-create-appuser.js:/scripts/mongo-create-appuser.js:ro
    entrypoint: >-
      sh -c "BIN=$$(command -v mongosh || command -v mongo);
      $$BIN --host mongo:27017
      -u \"$$MONGO_ROOT_USER\" -p \"$$MONGO_ROOT_PASSWORD\"
      --authenticationDatabase admin --eval
      \"load('/scripts/mongo-create-appuser.js');
      createAppUser('$$MONGO_APP_USER','$$MONGO_APP_PASSWORD','$$MONGO_DB');\""

  backend:
    build: ./backend
    container_name: datacore-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mongo-appuser:
        condition: service_completed_successfully
    ports:
      # Host-порт параметризован (HOST_PORT): внутри контейнера приложение
      # слушает свой PORT из .env (обычно 3000), наружу публикуем через HOST_PORT,
      # если 3000 занят другим контуром (odr/kppdf).
      - "${HOST_PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ${DATA_DIR}/uploads:/app/uploads
      # Локальная разработка: admin UI без пересборки образа.
      # (В prod-образ admin копируется через Dockerfile — см. docker-compose.prod.yml.)
      - ./backend/admin:/app/admin:ro
      - ./backend/pwa:/app/pwa:ro
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s

# Именованные тома. mongo-secrets — keyfile для --auth + rs0
# (наружу не монтируется, только внутри контура).
volumes:
  mongo-secrets:
