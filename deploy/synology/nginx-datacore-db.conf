# nginx на VPS: https://<домен>/db/ → data-core (через datacore-tunnel: 127.0.0.1:4201 → VM :3001).
# Вставить ВНУТРЬ существующего server { listen 443 ssl; ... } kppdf-proxy, ПЕРЕД `location /`.
# kppdf-локации не менять. Перед правкой: cp kppdf-proxy kppdf-proxy.bak-datacore-<дата>; после: nginx -t && systemctl reload nginx.
# Откат: вернуть .bak-файл → nginx -t && systemctl reload nginx.

# ^~ обязателен: иначе regex-локация статики kppdf (\.(js|css|svg…)$) перехватит /db/admin/admin.js.
location ^~ /db/ {
    # Если на уровне server включён auth_request (device-check kppdf) — раскомментировать:
    # auth_request off;
    proxy_pass http://127.0.0.1:4201/;          # хвостовой / срезает префикс /db
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Перезаписываем (не дописываем): backend с TRUST_PROXY=1 берёт IP для rate-limit из этого заголовка.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;                    # bulk в /api/apps (до 16 МБ)
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location = /db { return 301 /db/admin/; }
location = /db/ { return 301 /db/admin/; }
